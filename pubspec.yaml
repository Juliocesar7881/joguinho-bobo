name: lexinexo
description: Jogo de palavras em inglês com gameplay offline e anúncios intersticiais.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: 9.1.0
  shared_preferences: 2.5.5

dev_dependencies:
  crypto: ^3.0.7
  flutter_launcher_icons: 0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/legal/
    - assets/branding/worde-icon.png
    - THIRD_PARTY_NOTICES.md

flutter_launcher_icons:
  android: ic_launcher
  image_path: assets/branding/worde-icon.png
  adaptive_icon_background: "#0875F5"
  adaptive_icon_foreground: assets/branding/worde-adaptive-foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/branding/worde-adaptive-monochrome.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#0B0D18"
  image: assets/branding/worde-splash.png
  android: true
  ios: false
  web: false
  android_gravity: center
  android_screen_orientation: portrait
  android_12:
    color: "#0B0D18"
    image: assets/branding/worde-splash.png
    icon_background_color: "#0B0D18"
