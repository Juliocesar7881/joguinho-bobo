<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">Worde: Aprenda Palavras</title>
  <desc id="desc">Worde, jogo offline para aprender palavras em inglês.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#051B58"/>
      <stop offset="0.55" stop-color="#08388D"/>
      <stop offset="1" stop-color="#0875F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00113B" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#background)"/>
  <circle cx="908" cy="78" r="210" fill="#2B98FF" opacity="0.24"/>
  <image href="../../assets/branding/worde-icon.png" x="28" y="36" width="428" height="428" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
  <text x="490" y="164" fill="#FFFFFF" font-family="Roboto, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-2">Worde</text>
  <text x="494" y="218" fill="#DDEEFF" font-family="Roboto, Arial, sans-serif" font-size="29" font-weight="600">Aprenda palavras em inglês jogando.</text>
  <g font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="494" y="278" width="126" height="48" rx="24" fill="#FFFFFF" opacity="0.16" stroke="#BFDFFF"/>
    <text x="516" y="309" fill="#FFFFFF">3–8 letras</text>
    <rect x="636" y="278" width="158" height="48" rx="24" fill="#FFFFFF" opacity="0.16" stroke="#BFDFFF"/>
    <text x="658" y="309" fill="#FFFFFF">Dicas PT + EN</text>
    <rect x="810" y="278" width="156" height="48" rx="24" fill="#FFD21A" opacity="0.94"/>
    <text x="830" y="309" fill="#08205B">100% offline</text>
  </g>
  <text x="494" y="382" fill="#DDEEFF" font-family="Roboto, Arial, sans-serif" font-size="24">1.000 desafios • Sem anúncios • Sem contas</text>
</svg>
