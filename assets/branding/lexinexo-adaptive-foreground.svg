<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Foreground adaptativo do PalavraX</title>
  <desc id="desc">X de cinco blocos com a letra A central dentro da zona segura Android.</desc>
  <defs>
    <linearGradient id="violet" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A8CFF"/>
      <stop offset="1" stop-color="#7367F0"/>
    </linearGradient>
    <linearGradient id="blue" x1="924" y1="100" x2="100" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70A4FF"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="green" x1="376" y1="368" x2="648" y2="656" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46B77D"/>
      <stop offset="1" stop-color="#2E9B63"/>
    </linearGradient>
  </defs>

  <!-- Fills 82% of the source so the symbol stays bold after the 16% inset
       applied by flutter_launcher_icons to adaptive foregrounds. -->
  <rect x="92" y="92" width="252" height="252" rx="72" fill="url(#violet)"/>
  <rect x="680" y="92" width="252" height="252" rx="72" fill="url(#blue)"/>
  <rect x="92" y="680" width="252" height="252" rx="72" fill="url(#blue)"/>
  <rect x="680" y="680" width="252" height="252" rx="72" fill="url(#violet)"/>
  <rect x="368" y="368" width="288" height="288" rx="84" fill="url(#green)" stroke="#D5F5E4" stroke-width="9"/>
  <path d="M432 592L512 424L592 592M464 534H560" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
